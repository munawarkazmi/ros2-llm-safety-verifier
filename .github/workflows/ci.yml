name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Verifier tests + evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests + fuzz against the reference oracle
        run: make -C core test

      - name: Build evaluation harness
        run: make -C core eval

      # Fails on any missed unsafe case or any false positive, so the
      # numbers quoted in the README are enforced on every push.
      - name: Run evaluation (50 maps, seed 42)
        run: |
          mkdir -p /tmp/results
          core/build/eval --maps 50 --seed 42 --out /tmp/results/verifier_eval_ci.csv

      - name: Upload CI evaluation data
        uses: actions/upload-artifact@v4
        with:
          name: verifier-eval-ci
          path: /tmp/results/verifier_eval_ci.csv

      # Replays every committed model dataset; fails if any oracle-unsafe
      # plan passes the verifier (the load-bearing cell).
      - name: Re-evaluate committed LLM datasets
        run: |
          make -C core llm-tools
          for name in qwen2.5-7b-instruct llama-3.3-70b-versatile; do
            python3 llm_eval/parse.py --name "$name"
            core/build/llm_eval --parsed "llm_eval/parsed/$name.txt" \
              --scenarios llm_eval/scenarios \
              --label "$name (temperature 0)" \
              --out "/tmp/results/llm_eval_ci_$name.csv"
          done

  ros:
    name: ROS 2 node build (Humble)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: colcon build
        run: |
          . /opt/ros/humble/setup.sh
          mkdir -p /ws/src
          cp -r "$GITHUB_WORKSPACE" /ws/src/ros2_llm_safety_verifier
          cd /ws
          colcon build --packages-select ros2_llm_safety_verifier --event-handlers console_direct+
        shell: bash

  environment:
    name: Development environment builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No fallback and no continue-on-error: the badge means exactly
      # "the committed environment builds".
      - name: docker build
        run: docker build -t ros2-llm-safety-verifier .
