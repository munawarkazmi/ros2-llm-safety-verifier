name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  environment:
    name: Development environment builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No fallback and no continue-on-error: the badge means exactly
      # "the committed environment builds". When the verifier package
      # lands, a real colcon build + test job replaces this comment.
      - name: docker build
        run: docker build -t ros2-llm-safety-verifier .
