name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Verifier tests + evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests + fuzz against the reference oracle
        run: make -C core test

      - name: Build evaluation harness
        run: make -C core eval

      # Fails on any missed unsafe case or any false positive, so the
      # numbers quoted in the README are enforced on every push.
      - name: Run evaluation (50 maps, seed 42)
        run: |
          mkdir -p /tmp/results
          core/build/eval --maps 50 --seed 42 --out /tmp/results/verifier_eval_ci.csv

      - name: Upload CI evaluation data
        uses: actions/upload-artifact@v4
        with:
          name: verifier-eval-ci
          path: /tmp/results/verifier_eval_ci.csv

  environment:
    name: Development environment builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No fallback and no continue-on-error: the badge means exactly
      # "the committed environment builds".
      - name: docker build
        run: docker build -t ros2-llm-safety-verifier .
